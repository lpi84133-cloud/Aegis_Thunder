name: aegis_thunder
description: "Aegis Thunder - deflect Zeus's lightning bolts."
publish_to: 'none'

version: 1.0.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0F1A"
  adaptive_icon_foreground: "assets/icon.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/bg21zeus.webp
    - assets/bgZeus.webp
    - assets/clouds.webp
    - assets/floor.webp
    - assets/horizontalloading.webp
    - assets/verticalloading.webp
    - assets/icon.png
    - assets/lightbolt.webp
    - assets/logo.webp
    - assets/shield.webp
    - assets/target.webp
    - assets/zeus.webp
